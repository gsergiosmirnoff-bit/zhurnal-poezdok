\r\n  const сТипом = /^(г\\.?|г\\.о\\.|го)\\s/i.test(г) || ТИП_НП.test(г) || /,|област|край|респ|район|р-н|округ/i.test(г);\r\n  return [г ? (сТипом || н ? г : 'г. ' + г) : '', н, у].filter(Boolean).join(', ');\r\n}\r\n// Вид адреса: г. Москва, ул.Волочаевская. Служба адресов пишет «Волочаевская улица» или «улица Волочаевская»\r\nfunction видУлицы(а) {\r\n  const ч = String(а || '').split(', ');\r\n  if (/^(Москва|Санкт-Петербург)$/.test(ч[0])) ч[0] = 'г. ' + ч[0];\r\n  const п = ч[ч.length - 1], м = п.toLowerCase();\r\n  const типы = [['улица', 'ул.'], ['проспект', 'просп.'], ['переулок', 'пер.'], ['шоссе', 'ш.'], ['бульвар', 'б-р.'], ['площадь', 'пл.'], ['набережная', 'наб.'], ['проезд', 'проезд '], ['тупик', 'туп.'], ['аллея', 'аллея ']];\r\n  // Записи версий 1.40–1.41: «ул Волочаевская»\r\n  const старый = п.match(/^(ул|пер|пл|наб|ш|б-р|туп)\\s+(.+)$/), старыйПр = п.match(/^пр-кт\\s+(.+)$/);\r\n  if (старый) ч[ч.length - 1] = старый[1] + '.' + старый[2];\r\n  else if (старыйПр) ч[ч.length - 1] = 'просп.' + старыйПр[1];\r\n  else for (const [т, с] of типы) {\r\n    if (м.endsWith(' ' + т)) { ч[ч.length - 1] = с + п.slice(0, -т.length - 1); break; }\r\n    if (м.startsWith(т + ' ')) { ч[ч.length - 1] = с + п.slice(т.length + 1); break; }\r\n  }\r\n  return ч.join(', ');\r\n}\r\n// Записи прошлых версий приводим к этому виду\r\nS.отметки.forEach((о) => {\r\n  if (о.адресТелефона && о.улица === о.адресТелефона) { о.улица = видУлицы(о.улица); о.адресТелефона = о.улица; } else if (о.адресТелефона) о.адресТелефона = видУлицы(о.адресТелефона);\r\n  if (о.улица || о.дом) о.адрес = составитьАдрес(о.улица, о.дом, о.корпус, о.строение);\r\n});\r\n// Литры из отметок прошлых версий переносим в заправки за день\r\nS.отметки.forEach((о) => {\r\n  if (о.литрыКарта || о.литрыЛичные) {\r\n    if (!о.удалена) { const к = ключДня(new Date(о.время)), з = (S.заправки[к] = S.заправки[к] || { карта: '', личные: '' }); з.карта = (+з.карта || 0) + (+о.литрыКарта || 0) || ''; з.личные = нить(); показать(); }\r\n}, 0);\r\nlet открыта = null, месяц = ключМесяца(new Date()), смена = false;\r\nfunction сохранить() {\r\n  const т = JSON.stringify(S);\r\n  let ok = true;\r\n  try { if (ТЕЛЕФОН) ok = ТЕЛЕФОН.save(т); else localStorage.setItem(КЛЮЧ, т); } catch (e) { ok = false; }\r\n  if (!ok) alert('Не удалось сохранить запись. Проверьте, есть ли свободное место на телефоне.');\r\n}\r\n\r\n// ---------- координаты ----------\r\nconst ждут = {}, вЗапросе = new Set();\r\nwindow.__point = (id, р) => { const f = ждут[id]; delete ждут[id]; if (f) f(р); };\r\nfunction найтиТочку(id) {\r\n  return new Promise((готово) => {\r\n    if (ТЕЛЕФОН) { ждут[id] = готово; ТЕЛЕФОН.findPoint(id); return; }\r\n    if (!navigator.geolocation) return готово({ ошибка: 'нет сигнала' });\r\n    navigator.geolocation.getCurrentPosition(\r\n      (p) => готово({ широта: p.coords.latitude, долгота: p.coords.longitude, точность: Math.round(p.coords.accuracy) }),\r\n      (e) => готово({ ошибка: e.code === 1 ? 'запрещено' : 'нет сигнала' }),\r\n      { enableHighAccuracy: true, timeout: 40000, maximumAge: 0 });\r\n  });\r\n}\r\n// Служба адресов иногда отвечает латиницей, поэтому приводим адрес к русскому написанию. Инженер всё равно проверяет его на экране\r\nconst СЛОВА = { moscow: 'Москва', moskva: 'Москва', 'saint petersburg': 'Санкт-Петербург', 'st petersburg': 'Санкт-Петербург', 'sankt-peterburg': 'Санкт-Петербург', 'moscow oblast': 'Московская область', 'leningrad oblast': 'Ленинградская область', oblast: 'область', ulitsa: 'улица', ul: 'улица', street: 'улица', st: 'улица', prospekt: 'проспект', prosp: 'проспект', avenue: 'проспект', ave: 'проспект', pereulok: 'переулок', lane: 'переулок', ln: 'переулок', shosse: 'шоссе', highway: 'шоссе', hwy: 'шоссе', proyezd: 'проезд', proezd: 'проезд', bulvar: 'бульвар', boulevard: 'бульвар', blvd: 'бульвар', ploshchad: 'площадь', square: 'площадь', sq: 'площадь', naberezhnaya: 'набережная', embankment: 'набережная', tupik: 'тупик', alleya: 'аллея', mikrorayon: 'микрорайон', district: 'район', rayon: 'район', russia: 'Россия' };\r\nconst БУКВЫ = [['shch', 'щ'], ['sch', 'щ'], ['aya', 'ая'], ['yaya', 'яя'], ['zh', 'ж'], ['kh', 'х'], ['ts', 'ц'], ['ch', 'ч'], ['sh', 'ш'], ['yu', 'ю'], ['ya', 'я'], ['yo', 'ё'], ['ye', 'е'], ['a', 'а'], ['b', 'б'], ['v', 'в'], ['g', 'г'], ['d', 'д'], ['e', 'е'], ['z', 'з'], ['i', 'и'], ['y', 'ы'], ['k', 'к'], ['l', 'л'], ['m', 'м'], ['n', 'н'], ['o', 'о'], ['p', 'п'], ['r', 'р'], ['s', 'с'], ['t', 'т'], ['u', 'у'], ['f', 'ф'], ['h', 'х'], ['c', 'к'], ['w', 'в'], ['x', 'кс'], ['q', 'к'], ['j', 'й']];\r\nfunction словоПорусски(сл) {\r\n  const н = сл.toLowerCase();\r\n  if (СЛОВА[н]) return СЛОВА[н];\r\n  // Окончания: Nevsky → Невский, Bolshoy → Большой, Novyy → Новый\r\n  let осн = н, конец = '';\r\n  for (const [к, р] of [['skiy', 'ский'], ['sky', 'ский'], ['iy', 'ий'], ['yy', 'ый'], ['oy', 'ой'], ['aya', 'ая'], ['oye', 'ое'], ['yye', 'ые']]) if (н.length > к.length + 1 && н.endsWith(к)) { осн = н.slice(0, -к.length); конец = р; break; }\r\n  let вых = '';\r\n  for (let i = 0; i < осн.length;) {\r\n    const п = БУКВЫ.find(([л]) => осн.startsWith(л, i));\r\n    if (п) { вых += п[1]; i += п[0].length; } else { вых += осн[i]; i++; }\r\n  }\r\n  вых += конец;\r\n  return /^[A-Z]/.test(сл) ? вых[0].toUpperCase() + вых.slice(1) : вых;\r\n}\r\nfunction порусски(а) {\r\n  let т = String(а || '');\r\n  if (!/[A-Za-z]/.test(т)) return т;\r\n  т = т.replace(/moscow oblast|leningrad oblast|saint petersburg|st\\.? petersburg/gi, (м) => СЛОВА[м.toLowerCase().replace('.', '')]);\r\n  // Номер дома: 7A → 7А; строение и корпус пишем как принято\r\n  т = т.replace(/(\\d)[Aa]\\b/g, '$1А').replace(/(\\d)[Bb]\\b/g, '$1Б').replace(/(\\d)[Vv]\\b/g, '$1В').replace(/(\\d)[Kk](\\d)/g, '$1к$2').replace(/(\\d)[Ss](\\d)/g, '$1с$2');\r\n  return т.replace(/[A-Za-z][A-Za-z'-]*\\.?/g, (сл) => сл.replace(/\\.$/, '').split('-').map(словоПорусски).join('-'));\r\n}\r\n// Пришёл ответ по другой записи: открытую форму не трогаем, иначе пропадёт то, что инженер ещё вписывает\r\nfunction перерисоватьСписок() { if (!открыта && !смена) показать(); }\r\n// Адрес определяет сам телефон, если есть интернет. Без интернета адрес определится в офисе, вписывать его не нужно\r\nwindow.__address = (id, а, причина, источник) => {\r\n  вЗапросе.delete(id);\r\n  const о = всеЗаписи().find((x) => x.id === id);\r\n  if (!о) return;\r\n  а = видУлицы(порусски(а));\r\n  о.ошибкаАдреса = а ? '' : причина || '';\r\n  if (а && !(о.парковка && (о.изПоездки || о.адресПроверен))) о.источникАдреса = источник || '';\r\n  if (!а) сохранить();\r\n  if (а) {\r\n    const было = о.адресТелефона;\r\n    о.адресТелефона = а;\r\n    // После «Готово» адрес принадлежит инженеру: уточнение меняет только столбец «Адрес автоматически»\r\n    if (!о.адресПроверен && (!о.улица || о.улица === было)) { о.улица = а; о.адрес = составитьАдрес(а, о.дом, о.корпус, о.строение); }\r\n    сохранить();\r\n    const п = открыта === id && document.getElementById('adr');\r\n    if (п && !о.адресПроверен && (!п.value || п.value === было)) п.value = а;\r\n  }\r\n  if (открыта === id) обновитьМетку(о); else перерисоватьСписок();\r\n};\r\n// Соседние улицы приходят следом за основной. Ответ по старой точке (точка уже уточнилась) не берём\r\nwindow.__streets = (id, ш, д, список) => {\r\n  const о = всеЗаписи().find((x) => x.id === id);\r\n  if (!о || о.парковка || о.широта == null || Math.abs(о.широта - ш) > 1e-6 || Math.abs(о.долгота - д) > 1e-6) return;\r\n  const свои = о.адресТелефона || '';\r\n  о.соседниеУлицы = [...new Set((список || []).map((у) => видУлицы(порусски(у))).filter((у) => у && у !== свои))].slice(0, 3);\r\n  сохранить();\r\n  if (открыта === id) показАдреса();\r\n};\r\nfunction запроситьАдрес(о, заново) {\r\n  if (о.повтор && !о.отказОтПовтора) return;\r\n  if (!ТЕЛЕФОН || !ТЕЛЕФОН.geocode || о.широта == null || navigator.onLine === false) return;\r\n  if (заново || (!о.адресТелефона && !о.адресПроверен && !о.улица && !вЗапросе.has(о.id))) { вЗапросе.add(о.id); delete о.соседниеУлицы; ТЕЛЕФОН.geocode(о.id, о.широта, о.долгота, !о.парковка); }\r\n}\r\n// Повторный адрес: инженер уже был в этом месте и подтвердил адрес. Предлагаем его, а карту не спрашиваем:\r\n// адрес появится без интернета и без опечаток, а координаты не уйдут в сервис адресов. Решает инженер: «Да, тот же» или «Нет, другой»\r\nconst РЯДОМ_М = 60;\r\nconst метров = (a1, o1, a2, o2) => Math.hypot((a1 - a2) * 111000, (o1 - o2) * 111000 * Math.cos(a1 * Math.PI / 180));\r\nfunction знакомоеМесто(о) {\r\n  if (о.парковка || о.событие || о.вручную || о.широта == null || о.поддельный || о.точность > 100) return null;\r\n  let лучшее = null, мин = Infinity;\r\n  for (const x of S.отметки) {\r\n    if (x === о || x.удалена || x.черновик || x.событие || x.вручную || x.поддельный || x.широта == null || !x.адресПроверен || !естьДом(x.адрес)) continue;\r\n    const м = метров(о.широта, о.долгота, x.широта, x.долгота);\r\n    if (м <= РЯДОМ_М && м < мин) { мин = м; лучшее = x; }\r\n  }\r\n  return лучшее;\r\n}\r\nfunction подобратьАдрес(о, заново) {\r\n  if (!о.парковка && !о.адресПроверен && !о.отказОтПовтора && !о.повторПринят) {\r\n    const x = знакомоеМесто(о);\r\n    if (x) { о.повтор = x.id; сохранить(); return; }\r\n    delete о.повтор;   // уточнённая точка ушла от знакомого места\r\n  }\r\n  запроситьАдрес(о, заново);\r\n}\r\nfunction принятьПовтор(id, да) {\r\n  const о = S.отметки.find((x) => x.id === id);\r\n  if (!о) return;\r\n  const п = S.отметки.find((x) => x.id === о.повтор);\r\n  if (да && п) {\r\n    о.повторПринят = true; о.источникАдреса = 'как в прошлый раз';\r\n    о.улица = п.улица || п.адрес; о.дом = п.улица ? п.дом || '' : ''; о.корпус = п.улица ? п.корпус || '' : ''; о.строение = п.улица ? п.строение || '' : '';\r\n    о.адрес = составитьАдрес(о.улица, о.дом, о.корпус, о.строение);\r\n    if (открыта === id && document.getElementById('adr')) {\r\n      document.getElementById('adr').value = о.улица; document.getElementById('dom').value = о.дом; document.getElementById('korp').value = о.корпус; document.getElementById('str').value = о.строение;\r\n    }\r\n  } else { о.отказОтПовтора = true; delete о.повтор; }\r\n  сохранить();\r\n  if (!да) запроситьАдрес(о);\r\n  if (открыта === id) обновитьМетку(о); else перерисоватьСписок();\r\n}\r\n// Первая точка: показываем место и запрашиваем адрес сразу, инженер не ждёт уточнения\r\nwindow.__pointProgress = (id, р) => {\r\n  const о = всеЗаписи().find((x) => x.id === id);\r\n  if (!о || !о.поиск) return;\r\n  о.широта = р.широта; о.долгота = р.долгота; о.точность = р.точность; признакиТочки(о, р);\r\n  сверитьСПоездкой(о);\r\n  сохранить();\r\n  подобратьАдрес(о);\r\n  if (открыта === id) обновитьМетку(о); else перерисоватьСписок();\r\n};\r\nconst далеко = (a1, o1, a2, o2) => Math.hypot((a1 - a2) * 111000, (o1 - o2) * 111000 * Math.cos(a1 * Math.PI / 180)) > 50;\r\nfunction признакиТочки(о, р) {\r\n  о.источникТочки = р.источник === 'gps' ? 'GPS' : р.источник === 'network' ? 'сеть' : р.источник || '';\r\n  о.поддельный = о.поддельный || !!р.поддельный;\r\n  if (р.расхождение !== undefined && р.расхождение !== '') о.расхождение = +р.расхождение;\r\n  // 1.84: признаки подмены местоположения. Отметку не запрещаем (решение пользователя), а пишем комментарий в столбец «Поддельный GPS»\r\n  if (р.подмена) о.подменаТелефон = р.подмена;\r\n  if (р.спутников !== undefined) о.спутников = р.спутников;\r\n  о.подменаЖурнал = признакиПоЖурналу(о);\r\n}\r\n// Проверки по самому журналу: программы подмены ставят точку «из списка» — до сантиметра ту же — и «перелетают» между объектами\r\nconst МАКС_СКОРОСТЬ_КМЧ = 150;\r\nfunction признакиПоЖурналу(о) {\r\n  if (о.широта == null) return '';\r\n  const чм = (t) => { const d = new Date(t); return `${дв(d.getDate())}.${дв(d.getMonth() + 1)} ${дв(d.getHours())}:${дв(d.getMinutes())}`; };\r\n  const все = S.отметки.concat(S.парковки || []).filter((x) => x !== о && !x.удалена && !x.вручную && x.широта != null && x.долгота != null);\r\n  const ч = [];\r\n  const та = все.find((x) => Math.abs(x.время - о.время) > 10 * 60000 && String(x.широта) === String(о.широта) && String(x.долгота) === String(о.долгота) && /\\.\\d{5,}/.test(String(о.широта)));\r\n  if (та) ч.push(`координаты до сантиметра совпадают с отметкой ${чм(та.время)} (настоящий GPS так не повторяется)`);\r\n  const до = все.filter((x) => x.время < о.время && ключДня(new Date(x.время)) === ключДня(new Date(о.время))).sort((a, b) => b.время - a.время)[0];\r\n  if (до) {\r\n    const км = Math.hypot((о.широта - до.широта) * 111, (о.долгота - до.долгота) * 111 * Math.cos(о.широта * Math.PI / 180)), ч_ = (о.время - до.время) / 3600000;\r\n    if (км > 10 && ч_ > 0 && км / ч_ > МАКС_СКОРОСТЬ_КМЧ) ч.push(`от отметки ${чм(до.время)} до этой ${Math.round(км)} км за ${Math.max(1, Math.round(ч_ * 60))} мин (${Math.round(км / ч_)} км/ч)`);\r\n  }\r\n  return ч.join('; ');\r\n}\r\n// Текст для столбца «Поддельный GPS»: «да…» — телефон точно сообщил о подмене, «подозрение…» — косвенные признаки. Старые записи — просто «да»\r\nfunction текстПодмены(о) {\r\n  let т = о.подменаТелефон || (о.поддельный ? 'да' : '');\r\n  if (о.подменаЖурнал) т = т ? т + '; ' + о.подменаЖурнал : 'подозрение: ' + о.подменаЖурнал;\r\n  return т;\r\n}\r\n// Забыли нажать «Я приехал»: запись задним числом. Координат у неё нет, в файле она помечена как внесённая вручную\r\nfunction добавитьВручную() {\r\n  const [г, м, д] = деньСп.split('-').map(Number), t = new Date(г, м - 1, д, 12, 0);\r\n  const о = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), время: t.getTime(), вручную: true, черновик: true, поиск: false, улица: '', дом: '', корпус: '', строение: '', широта: null, долгота: null, точность: null, ошибка: '', номер: '', адрес: '', примечание: '', удалена: false };\r\n  S.отметки.push(о); открыта = о.id; показать();\r\n}\r\n// Дом: только время. Координаты и адрес не нужны, дом подставится ion показать() { показатьЭкран(); режимВвода(); }\r\nfunction показатьЭкран() {\r\n  document.getElementById('who').textContent = S.инженер && !смена ? S.инженер : '';\r\n  window.scrollTo(0, 0);\r\n  if (!S.инженер || смена) return экранИмени();\r\n  if (спроситьНапоминания()) return;\r\n  const о = S.отметки.find((x) => x.id === открыта);\r\n  if (о) return экранОтметки(о);\r\n  const пк = S.парковки.find((x) => x.id === открыта);\r\n  if (пк) return экранЗаписиПарковки(пк);\r\n  // Адрес мог прийти, пока инженер вписывает показания: возвращаем курсор в поле\r\n  const ф = document.activeElement && document.activeElement.id;\r\n  экранГлавный();\r\n  if (['spV', 'spB', 'lK', 'lL'].includes(ф)) document.getElementById(ф).focus();\r\n}\r\n// ---------- карточка сотрудника из Excel: та же, что загружает «Авансовые отчёты» ----------\r\n// Из карточки берём только ФИО. Домашний адрес не берём: в приложении дом не хранится, его подставляет топливный отчёт\r\nasync function распаковатьXlsx(байты) {\r\n  const dv = new DataView(байты.buffer, байты.byteOffset, байты.byteLength);\r\n  let к = байты.length - 22; while (к >= 0 && dv.getUint32(к, true) !== 0x06054b50) к--;\r\n  if (к < 0) throw new Error('это не файл Excel (.xlsx)');\r\n  const всего = dv.getUint16(к + 10, true); let п = dv.getUint32(к + 16, true);\r\n  const файлы = {};\r\n  for (let i = 0; i < всего; i++) {\r\n    const метод = dv.getUint16(п + 10, true), сжато = dv.getUint32(п + 20, true), дИмени = dv.getUint16(п + 28, true), дДоп = dv.getUint16(п + 30, true), дКомм = dv.getUint16(п + 32, true), лок = dv.getUint32(п + 42, true);\r\n    const имя = new TextDecoder().decode(байты.subarray(п + 46, п + 46 + дИмени));\r\n    const начало = лок + 30 + dv.getUint16(лок + 26, true) + dv.getUint16(лок + 28, true);\r\n    файлы[имя] = { метод, данные: байты.subarray(начало, начало + сжато) };\r\n    п += 46 + дИмени + дДоп + дКомм;\r\n  }\r\n  return async (имя) => {\r\n    const ф = файлы[имя]; if (!ф) return null; TagName('t')).map((x) => x.textContent).join('') : v ? v.textContent : '';\r\n    const м = (r || '').match(/^([A-Z]+)(\\d+)$/); if (!м) continue;\r\n    ячейки[`${м[1].split('').reduce((с, б) => с * 26 + б.charCodeAt(0) - 64, 0)},${м[2]}`] = String(знач ?? '').trim();\r\n  }\r\n  return ячейки;\r\n}\r\n// ФИО из карточки: подпись «ФИО» и значение справа (карточка столбиком) или снизу (карточка строкой)\r\nfunction фиоИзКарточки(ячейки) {\r\n  const чисто = (т) => String(т || '').toLowerCase().replace(/ё/g, 'е').replace(/[:*\\s]+$/, '').trim();\r\n  const подпись = (т) => /^(ф\\.?\\s?и\\.?\\s?о\\.?|фио( сотрудника)?|сотрудник|водитель)$/.test(чисто(т));\r\n  // Подписи всех полей карточки (как в «Авансовых отчётах»): справа от «ФИО» может стоять подпись соседнего поля, а не значение\r\n  const любаяПодпись = (т) => подпись(т) || /^(департамент|центр|отдел|группа|должность|табельный( номер)?|таб\\.? ?№|банк|лицевой сч[её]т|номер лицевого сч[её]та|сч[её]т|автомобиль|авто|марка( автомобиля| авто)?|гос\\.? ?номер( авто(мобиля)?)?|госномер|номер авто(мобиля)?|номер карты .?тройк.?|карта .?тройк.?|домашний адрес|адрес|график( работы)?|расч[её]тный сч[её]т|р\\/с|номер (водительского )?удостоверения|марка горючего|горючее|норма расхода.*|бик( банка)?|корр\\.? ?сч[её]т( банка)?|корреспондентский сч[её]т( банка)?|расход топлива.*|норма расхода.*|организация.*)$/.test(чисто(т));\r\n  for (const [адр, т] of Object.entries(ячейки)) {\r\n    if (!подпись(т)) continue;\r\n    const [c, r] = адр.split(',').map(Number), справа = ячейки[`${c + 1},${r}`], снизу = ячейки[`${c},${r + 1}`];\r\n    const знач = справа && !любаяПодпись(справа) ? справа : снизу && !любаяПодпись(снизу) ? снизу : '';\r\n    if (знач) return знач;\r\n  }\r\n  if (Object.values(ячейки).some((т) => подпись(т))) throw new Error('в карточке не заполнено ФИО. Откройте файл в Excel, впишите данные сотрудника в строку под названиями столбцов (строка 2), сохраните и загрузите снова');\r\n  throw new Error('в файле не нашлась строка «ФИО» или «Водитель». Выберите карточку сотрудника для «Авансовых отчётов» или свой топливный отчёт Excel');\r\n}\r\n// «Авдиенко Марина Алексеевна» → «Авдиенко М.А.». Уже готовые «Иванов И.И.» и «Иванов И. И.» не меняются\r\nfunction фамилияИнициалы(фио) {\r\n  const сл = String(фио || '').replace(/\\s+/g, ' ').trim().split(' ');\r\n  const с = (т) => т ? т[0].toUpperCase() + т.slice(1) : т;\r\n  if (сл.length >= 3 && сл[1].replace(/\\./g, '').length > 1) return `${с(сл[0])} ${сл[1][0].toUpperCase()}.${сл[2][0].toUpperCase()}.`;\r\n  if (сл.length === 2 && /^[А-ЯЁ]\\.?[А-ЯЁ]\\.?$/i.test(сл[1])) { const и = сл[1].replace(/\\./g, '').toUpperCase(); return `${с(сл[0])} ${и[0]}.${и[1]}.`; }\r\n  if (сл.length === 3 && /^[А-ЯЁ]\\.?$/i.test(сл[1]) && /^[А-ЯЁ]\\.?$/i.test(сл[2])) return `${с(сл[0])} ${сл[1][0].toUpperCase()}.${сл[2][0].toUpperCase()}.`;\r\n  return сл.join(' ');\r\n}\r\nwindow.__card = async (б64, ошибка) => {\r\n  if (ошибка) return alert(ошибка);\r\n  if (!б64) return;\r\n  try {\r\n    const с = atob(б64), б = new Uint8Array(с.length); for (let i = 0; i < с.length; i++) б[i] = с.charCodeAt(i);\r\n    const фио = фиоИзКарточки(await листКарточкиXlsx(б)), коротко = фамилияИнициалы(фио);\r\n    const поле = document.getElementById('fio');\r\n    if (поле) поле.value = коротко;\r\n    alert(`Из файла взято ФИО: ${фио}. В журнал оно запишется так: ${коротко}. Проверьте и нажмите «Сохранить».`);\r\n  } catch (e) { alert('Не удалось прочитать карточку: ' + (e.message || e) + '.'); }\r\n};\r\nfunction загрузитьКарточку() {\r\n  if (ТЕЛЕФОН && ТЕЛЕФОН.pickXlsx) return ТЕЛЕФОН.pickXlsx();\r\n  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xlsm';\r\n  inp.onchange = async () => { const б = new Uint8Array(await inp.files[0].arrayBuffer()); let с = ''; for (let i = 0; i < б.length; i += 8192) с += String.fromCharCode.apply(null, б.subarray(i, i + 8192)); window.__card(btoa(с), ''); };\r\n  inp.click();\r\n}\r\nfunction экранИмени() {\r\n  а.innerHTML = `<div class=\"card\" style=\"max-height:100%;overflow-y:auto\"><b>Впишите свои фамилию, имя и отчество</b>\r\n    <label for=\"fio\">Полностью, например: Иванов Иван Иванович</label><input id=\"fio\" autocomplete=\"name\" autocapitalize=\"words\" value=\"${экран(S.инженер)}\">\r\n    <p class=\"tip\">Пишите полностью, без сокращений: у нас есть однофамильцы. Остальные данные (машину, нормы, домашний адрес) вы загрузите карточкой сотрудника, когда будете готовить топливный отчёт.</p>\r\n    <button class=\"main\" id=\"ok\">Сохранить</button>\r\n    <p class=\"tip\">Приложение записывает место и время только в тот момент, когда вы нажимаете «Я приехал» или «Внести парковку». Записи хранятся в браузере этого планшета. Сохраняйте резервную копию на закладке «💾 Резервная копия».</p>\r\n    ${ТЕЛЕФОН && ТЕЛЕФОН.restoreBackup && !S.инженер && !S.отметки.length ? '<button class=\"main light\" id=\"restore\" type=\"button\">Восстановить из резервной копии</button><p class=\"tip\">Нажмите кнопку и выберите копию, сохранённую на закладке «💾 Резервная копия», или копию из приложения на телефоне («Загрузки» → «Журнал поездок» → «Журнал поездок — резервная копия»).</p>' : ''}</div>`;\r\n  const вос = document.getElementById('restore');\r\n  if (вос) вос.onclick = () => ТЕЛЕФОН.restoreBackup();\r\n  document.getElementById('ok').onclick = () => {\r\n    // Решение пользователя 12.11.2026: инженер сам вписывает ФИО полностью (однофамильцы), без загрузки карточки;\r\n    // полная карточка (машина, нормы, дом) загружается в топливном отчёте. Отчества может не быть — тогда два слова\r\n    const ф = document.getElementById('fio').value.trim().replace(/\\s+/g, ' ').toLowerCase().replace(/(^|[\\s-])([а-яё])/g, (x, a, б) => a + б.toUpperCase());\r\n    const сл = '[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?';\r\n    if (!new RegExp(`^${сл} ${сл}( ${сл}){0,2}$`).test(ф)) return alert('Впишите фамилию, имя и отчество полностью, без сокращений, например: Иванов Иван Иванович');\r\n    S.инженер = ф; смена = false; сохранить(); показать();\r\n  };\r\n}\r\n// Дом есть: «д.77», «д.77,к.А», «77 к А», «12/3». Корпус или строение буквой в конце дом не отменяют\r\nconst естьДом = (а) => { const т = String(а || '').trim(); return /(^|[\\s,])д\\.\\s*\\d/i.test(т) || /\\d[^\\s,]*(\\s*,?\\s*(к|корп|корпус|с|стр|строение)\\.?\\s*[^\\s,]+)*$/i.test(т); };\r\n// 1.84: инженер видит, что отметка помечена. Записать её можно, проверяющий увидит комментарий\r\nfunction меткаТочки(о) {\r\n  const т = о.широта != null && !о.вручную ? текстПодмены(о) : '';\r\n  if (!т) return меткаТочкиБез(о);\r\n  // Решение пользователя 19.11.2026: при точной подмене — коротко, без подробностей\r\n  if (/^да/.test(т)) return '<div class=\"gps bad\">Вы используете подмену GPS — отключите её. Если GPS не работает, впишите адрес вручную.</div>' + меткаТочкиБез(о);\r\n  const заголовок = /^да/.test(т) ? 'Телефон сообщил о подмене местоположения.' : 'Местоположение похоже на подменённое.';\r\n  return `<div class=\"gps bad\">${заголовок} Отметка записана с пометкой для проверки: ${экран(т.replace(/^(да|подозрение):?\\s*/, ''))}. ${/^да/.test(т) ? 'Выключите программу подмены и нажмите «Я приехал» снова. Если GPS не работает, впишите адрес вручную.' : 'Если это ошибка, ничего делать не нужно: проверяющий посмотрит отметку.'}</div>` + меткаТочкиБез(о);\r\n}\r\nfunction меткаТочкиБез(о) {\r\n  if (о.парковка && о.изПоездки) return '<div class=\"gps ok\">Адрес взят из вашей последней поездки. Проверьте его и впишите номер парковки.</div>';\r\n  if (о.парковка && (о.широта != null || о.поиск)) {\r\n    if (о.широта == null) return '<div class=\"gps\">Ищу координаты. Ждать не обязательно: впишите номер и нажмите «Готово».</div>';\r\n    if (о.адресТелефона) return `<div class=\"gps ok\">Проверьте улицу, впишите дом и номер парковки. Точность ${о.точность >= 0 ? 'около ' + о.точность + ' м' : 'неизвестна'}.</div>`;\r\n    return `<div class=\"gps ok\">Место записано.</div><div class=\"gps warn\" style=\"margin-top:3px\">${вЗапросе.has(о.id) ? 'Определяю адрес…' : 'Телефон пока не определил адрес. Если у вас нет интернета, нажмите «Вписать адрес вручную».'}</div>`;\r\n  }\r\n  if (о.вручную) return '<div class=\"gps\">Запись вносится вручную, координат у неё нет.</div>';\r\n  const пов = о.повтор && !о.адресПроверен && !о.повторПринят && S.отметки.find((x) => x.id === о.повтор);\r\n  if (пов) return `<div class=\"gps ok\">Вы уже были здесь: <b>${экран(пов.адрес)}</b>. Это тот же адрес?</div><div class=\"seg povtor\"><button type=\"button\" id=\"povDa\" data-id=\"${о.id}\">Да, тот же</button><button type=\"button\" id=\"povNet\" data-id=\"${о.id}\">Нет, другой</button></div>`;\r\n  if (о.повторПринят && !о.адресПроверен) return '<div class=\"gps ok\">Адрес как в прошлый раз. Проверьте его и нажмите «Готово».</div>';\r\n  // Улица найдена: одна короткая строка, чтобы поля помещались крупным шрифтом\r\n  if (о.широта != null && !о.поиск && о.адресТелефона) return `<div class=\"gps ok\">${частиСтроки(о.улица || о.адресТелефона).улица || частиСтроки(о.улица || о.адресТелефона).село ? 'Проверьте улицу и впишите дом.' : 'Телефон нашёл только город. Нажмите «Изменить адрес» и впишите улицу и дом.'} Точность ${о.точность >= 0 ? 'около ' + о.точность + ' м' : 'неизвестна'}.</div>`;\r\n  if (о.поиск && о.широта == null) return '<div class=\"gps\">Ищу координаты. Ждать не обязательно: вы можете заполнить поля и нажать «Готово».</div>';\r\n  if (о.широта != null) return `<div class=\"gps ok\">${о.поиск ? 'Место найдено, уточняю в фоне' : 'Место записано'}, точность ${о.точность >= 0 ? 'около ' + о.точность + ' м' : 'неизвестна'}. </div><div class=\"gps ${о.адресТелефона && естьДом(о.адресТелефона) ? '' : 'warn'}\" style=\"margin-top:3px\">${о.адресТелефона ? (естьДом(о.адресТелефона) ? 'Проверьте адрес. Если он неточный, нажмите «Исправить адрес».' : 'Впишите дом, корпус и строение, если они есть.') : (вЗапросе.has(о.id) ? 'Определяю адрес…' : 'Телефон пока не определил улицу. Если у вас нет интернета, нажмите «Вписать адрес вручную» и впишите город и улицу сами.')}</div>`;\r\n  const доп = о.ошибка === 'запрещено' ? '<div class=\"notice\" style=\"margin:4px 0 0\"><button id=\"toApp\" style=\"margin:0\">Открыть настройки приложения</button></div>' : о.ошибка === 'выключено' ? '<div class=\"notice\" style=\"margin:4px 0 0\"><button id=\"toGeo\" style=\"margin:0\">Открыть настройки геолокации</button></div>' : '';\r\n  return `<div class=\"gps bad\">${экран(ТЕКСТ_ОШИБКИ[о.ошибка] || ТЕКСТ_ОШИБКИ['нет сигнала'])}</div>${доп}`;\r\n}\r\nfunction обновитьМетку(о) {\r\n  const м = document.getElementById('gpsBox');\r\n  if (м) { м.innerHTML = меткаТочки(о); привязатьНастройки(); }\r\n  показАдреса();\r\n}\r\n// Адрес заполняется сам. Поле ввода появляется, только если инженер нажал кнопку\r\nfunction показАдреса() {\r\n  const в = document.getElementById('adrView'), п = document.getElementById('adr'), к = document.getElementById('adrEdit');\r\n  if (!в || !п || !к) return;\r\n  const правка = !п.hidden;\r\n  в.hidden = правка; к.hidden = правка;\r\n  // Полный адрес одной строкой — для проверок; на экране город и улица отдельно (1.86)\r\n  в.dataset.adres = п.value || в.dataset.pusto || 'Улица определится автоматически';\r\n  const заголовок = document.querySelector('label[for=\"adr\"]');\r\n  if (заголовок) заголовок.textContent = правка || !п.value ? 'Улица' : 'Адрес';\r\n  if (!п.value) в.textContent = в.dataset.adres;\r\n  else {\r\n    const р = частиСтроки(п.value), строка = (подпись, т, пусто) => `<div class=\"adrrow\"><span>${подпись}</span><b class=\"${т ? '' : 'net'}\">${т ? экран(т) : пусто}</b></div>`;\r\n    в.innerHTML = (р.город ? строка('Город', р.город) : '') + (р.село ? строка(/^(мкр|кв-л|тер)/i.test(р.село) ? 'Район' : 'Посёлок', р.село) : '') + (р.село && !р.улица ? '' : строка('Улица', р.улица, 'не найдена — впишите'));\r\n  }\r\n  в.classList.toggle('empty', !п.value);\r\n  к.textContent = п.value ? 'Изменить адрес' : 'Вписать адрес вручную';\r\n  показСоседей();\r\n}\r\n// Не та улица: показываем найденную и соседние, инженер нажимает нужную. Выбор попадёт в запись по «Готово»\r\nfunction показСоседей() {\r\n  const б = document.getElementById('ulVar'), п = document.getElementById('adr');\r\n  if (!б || !п) return;\r\n  const о = всеЗаписи().find((x) => x.id === открыта);\r\n  const список = о && !о.повторПринят && о.адресТелефона && о.соседниеУлицы && о.соседниеУлицы.length ? [о.адресТелефона, ...о.соседниеУлицы] : [];\r\n  б.hidden = !список.length || !п.hidden;\r\n  if (б.hidden) { б.innerHTML = ''; return; }\r\n  const улица = (а) => а.slice(а.lastIndexOf(', ') + 2);\r\n  б.innerHTML = '<div class=\"t\">Не та улица? Нажмите нужную:</div><div class=\"v\">' + список.map((а, i) => '<button type=\"button\" data-i=\"' + i + '\" class=\"' + (а === п.value ? 'on' : '') + '\">' + экран(улица(а)) + '</button>').join('') + '</div>';\r\n  б.querySelectorAll('button').forEach((к) => { к.onclick = () => { п.value = список[+к.dataset.i]; показАдреса(); }; });\r\n}\r\nfunction привязатьНастройки() {\r\n  const да = document.getElementById('povDa'), нет = document.getElementById('povNet');\r\n  if (да) да.onclick = () => принятьПовтор(да.dataset.id, true);\r\n  if (нет) нет.onclick = () => принятьПовтор(нет.dataset.id, false);\r\n  const x = document.getElementById('toApp'), y = document.getElementById('toGeo');\r\n  if (x && ТЕЛЕФОН) x.onclick = () => ТЕЛЕФОН.openAppSettings();\r\n  if (y && ТЕЛЕФОН) y.onclick = () => ТЕЛЕФОН.openGeoSettings();\r\n}\r\nconst литрыТекст = (л) => (л === '' || л == null ? '' : String(л).replace('.', ','));\r\n// Пусто — заправки не было; null — ошибка в числе\r\nfunction литрыИзПоля(id) {\r\n  const т = document.getElementById(id).value.trim().replace(',', '.');\r\n  if (!т) return '';\r\n  const ч = Number(т);\r\n  return ч > 0 && ч <= 200 ? Math.round(ч * 100) / 100 : null;\r\n}\r\n// Правка адреса: город и улица в отдельных полях\r\nfunction открытьПравку() {\r\n  const п = document.getElementById('adr'), ч = п.value.split(', ').map((x) => x.trim()).filter(Boolean);\r\n  // Ручная запись прошлых версий: дом был в той же строке — переносим его в поле «Дом»\r\n  const дом = document.getElementById('dom');\r\n  if (дом && !дом.value.trim() && ч.length > 2 && /^(д\\.?\\s*)?\\d/i.test(ч[ч.length - 1])) дом.value = ч.pop().replace(/^д\\.?\\s*/i, '');\r\n  if (ч.length > 1 || (ч.length === 1 && (ТИП_НП.test(ч[0]) || ТИП_ГОРОДА.test(ч[0])))) {\r\n    const р = частиАдреса(ч);\r\n    document.getElementById('selo').value = р.село;\r\n    document.getElementById('gorod').value = р.город; п.value = р.улица;\r\n  }\r\n  document.getElementById('gorodBox').hidden = false; п.hidden = false;\r\n  показАдреса();\r\n}\r\nconst улицаСейчас = () => городИУлица(document.getElementById('gorod').value, document.getElementById('adr').value, document.getElementById('selo').value);\r\n// Ручная запись: нужен город (или область) и улица; в селе без улиц хватит села\r\nfunction ошибкаРучногоАдреса() {\r\n  const п = (id) => document.getElementById(id), г = п('gorod').value.trim(), н = п('selo').value.trim(), у = п('adr').value.trim();\r\n  if (у.includes(',')) return '';\r\n  if (!г && !н) { п('gorod').focus(); return 'Впишите город или область.'; }\r\n  if (!у && !н) { п('adr').focus(); return 'Впишите улицу. Если в селе нет улиц, впишите название села.'; }\r\n  return '';\r\n}\r\nfunction экранОтметки(о) {\r\n  const d = new Date(о.время);\r\n  а.innerHTML = `<div class=\"screen\"><div class=\"scroll form\"><b>${дв(d.getDate())}.${дв(d.getMonth() + 1)}.${d.getFullYear()}${о.вручную ? '' : ' в ' + дв(d.getHours()) + ':' + дв(d.getMinutes())}</b>\r\n    <div id=\"gpsBox\" style=\"margin-top:4px\">${меткаТочки(о)}</div>\r\n    ${о.вручную ? `<label for=\"vrem\">Время приезда</label><input id=\"vrem\" type=\"time\" value=\"${о.черновик ? '' : дв(d.getHours()) + ':' + дв(d.getMinutes())}\">` : ''}\r\n    <div id=\"gorodBox\" hidden><label for=\"gorod\">Город или область</label><input id=\"gorod\" autocomplete=\"off\" placeholder=\"Например: г. Истра или Московская область\"><label for=\"selo\">Село, деревня, посёлок (если есть)</label><input id=\"selo\" autocomplete=\"off\" placeholder=\"Например: с. Павловская Слобода\"></div>\r\n    <div class=\"adrhead\"><label for=\"adr\">Улица</label><button class=\"linkbtn\" id=\"adrEdit\" type=\"button\"></button></div><div id=\"adrView\" class=\"adrview\"></div><div id=\"ulVar\" class=\"ulvar\" hidden></div><input id=\"adr\" hidden autocomplete=\"off\" value=\"${экран(о.улица)}\">\r\n    <div class=\"pair\"><div><label for=\"dom\">Дом</label><input id=\"dom\" autocomplete=\"off\" value=\"${экран(о.дом)}\"></div><div><label for=\"korp\">Корпус</label><input id=\"korp\" autocomplete=\"off\" value=\"${экран(о.корпус)}\"></div><div><label for=\"str\">Строение</label><input id=\"str\" autocomplete=\"off\" value=\"${экран(о.строение)}\"></div></div>\r\n    <div class=\"seg\" style=\"margin-top:8px\"><button type=\"button\" id=\"vidZ\">На объект заявки</button><button type=\"button\" id=\"vidD\">Другая рабочая поездка</button></div>\r\n    <label for=\"prim\" id=\"primLabel\"></label><textarea id=\"prim\">${экран(о.примечание)}</textarea></div>\r\n    <div class=\"foot\"><button class=\"main\" id=\"save\">Готово</button><button class=\"main danger\" id=\"del\">Удалить</button></div></div>`;\r\n  привязатьНастройки();\r\n  // Ручная запись: сразу поля город, село, улица, дом\r\n  if (о.вручную) открытьПравку();\r\n  показАдреса();\r\n  document.getElementById('adrEdit').onclick = () => { открытьПравку(); document.getElementById('adr').focus(); };\r\n  let незаявка = !!о.незаявка;\r\n  const показВида = () => {\r\n    document.getElementById('vidZ').classList.toggle('on', !незаявка);\r\n    document.getElementById('vidD').classList.toggle('on', незаявка);\r\n    document.getElementById('primLabel').textContent = незаявка ? 'Для чего вы заехали, например за ключами или на склад (обязательно)' : 'Комментарий';\r\n  };\r\n  показВида();\r\n  document.getElementById('vidZ').onclick = () => { незаявка = false; показВида(); };\r\n  document.getElementById('vidD').onclick = () => { незаявка = true; показВида(); document.getElementById('prim').focus(); };\r\n  const собрать = () => { о.улица = улицаСейчас(); о.дом = document.getElementById('dom').value.trim(); о.корпус = document.getElementById('korp').value.trim(); о.строение = document.getElementById('str').value.trim(); о.адрес = составитьАдрес(о.улица, о.дом, о.корпус, о.строение); о.примечание = document.getElementById('prim').value.trim(); о.адресПроверен = !!о.адрес; };\r\n  document.getElementById('save').onclick = () => {\r\n    if (незаявка && !document.getElementById('prim').value.trim()) { document.getElementById('prim').focus(); return alert('Напишите, для чего вы заехали на эту точку.'); }\r\n    if (о.вручную) {\r\n      const вр = document.getElementById('vrem').value;\r\n      if (!вр) { document.getElementById('vrem').focus(); return alert('Укажите время приезда.'); }\r\n      const ош = ошибкаРучногоАдреса(); if (ош) return alert(ош);\r\n      const [ч, мин] = вр.split(':').map(Number), нов = new Date(d.getFullYear(), d.getMonth(), d.getDate(), ч, мин);\r\n      if (нов.getTime() > Date.now()) return alert('Время приезда не может быть позже текущего.');\r\n      о.время = нов.getTime();\r\n    }\r\n    const адрСейчас = составитьАдрес(улицаСейчас(), document.getElementById('dom').value.trim(), document.getElementById('korp').value.trim(), document.getElementById('str').value.trim());\r\n    if (адрСейчас && !естьДом(адрСейчас) && !confirm('Вы не вписали дом. Такой адрес придётся уточнять в офисе. Всё равно закрыть?')) return;\r\n    о.незаявка = незаявка;\r\n    собрать();\r\n    if (!о.поиск && о.широта == null && !о.номер && !о.адрес && !confirm('В записи нет ни координат, ни адреса. Такую запись нельзя будет разнести в отчёт. Всё равно закрыть?')) return;\r\n    // Новая запись в уже отправленном месяце: файл за этот месяц нужно отправить ещё раз\r\n    if (о.вручную && о.черновик) { delete о.черновик; delete S.отправленоМес[ключМесяца(new Date(о.время))]; }\r\n    // Закрыли, не ответив на «Вы уже были здесь?»: считаем это отказом, иначе адрес не запросится никогда\r\n    let спроситьКарту = false;\r\n    if (о.повтор && !о.повторПринят && !о.отказОтПовтора) { о.отказОтПовтора = true; delete о.повтор; спроситьКарту = !о.адрес; }\r\n    // Взяли прежний адрес, а потом исправили: это уже адрес инженера, не «как в прошлый раз»\r\n    if (о.повторПринят) { const п = S.отметки.find((x) => x.id === о.повтор); if (!п || п.адрес !== о.адрес) о.источникАдреса = 'исправлен инженером'; }\r\n    // Инженер выбрал соседнюю улицу: в файле видно, что улица не от карты, а выбрана им\r\n    else if (о.соседниеУлицы && о.соседниеУлицы.includes(о.улица)) о.источникАдреса = 'соседняя улица, выбрал инженер';\r\n    сохранить(); открыта = null; показать();\r\n    if (спроситьКарту) запроситьАдрес(о);\r\n  };\r\n  document.getElementById('del').onclick = () => { if (о.черновик) { S.отметки = S.отметки.filter((x) => x !== о); открыта = null; показать(); return; } if (!confirm('Удалить эту запись?')) return; о.удалена = true; открыта = null; сохранить(); показать(); };\r\n}\r\n// Запись о парковке: время и адрес подставляются сами, инженер вписывает номер\r\n// Пусто — суммы пока нет; null — ошибка в числе. Бесплатная парковка: 0\r\nfunction суммаИзПоля() {\r\n  const т = document.getElementById('parkSum').value.trim().replace(/\\s/g, '').replace(',', '.');\r\n  if (!т) return '';\r\n  const ч = Number(т);\r\n  return ч >= 0 && ч <= 100000 ? Math.round(ч * 100) / 100 : null;\r\n}\r\nconst рубли = (x) => (Math.round(x * 100) % 100 ? (Math.round(x * 100) / 100).toFixed(2) : String(Math.round(x))).replace('.', ',') + ' ₽';\r\nconst нетСуммы = (о) => о.сумма === '' || о.сумма == null;\r\nfunction записатьПолеПарковки(о) {\r\n  о.улица = улицаСейчас();\r\n  const пара = document.getElementById('dom');\r\n  if (пара && !пара.closest('.pair').hidden) { о.дом = пара.value.trim(); о.корпус = document.getElementById('korp').value.trim(); о.строение = document.getElementById('str').value.trim(); }\r\n  о.адрес = составитьАдрес(о.улица, о.дом, о.корпус, о.строение);\r\n  о.номер = document.getElementById('parkNo').value.trim(); const с = суммаИзПоля(); if (с !== null) о.сумма = с;\r\n}\r\nfunction экранЗаписиПарковки(о) {\r\n  const d = new Date(о.время);\r\n  а.innerHTML = `<div class=\"screen\"><div class=\"scroll form\"><b>Парковка ${дв(d.getDate())}.${дв(d.getMonth() + 1)}.${d.getFullYear()}${о.вручную ? '' : ` в ${дв(d.getHours())}:${дв(d.getMinutes())}`}</b>\r\n    <div id=\"gpsBox\" style=\"margin-top:4px\">${меткаТочки(о)}</div>\r\n    ${о.вручную ? `<label for=\"vrem\">Время парковки</label><input id=\"vrem\" type=\"time\" value=\"${о.черновик ? '' : дв(d.getHours()) + ':' + дв(d.getMinutes())}\">` : ''}\r\n    <div id=\"gorodBox\" hidden><label for=\"gorod\">Город или область</label><input id=\"gorod\" autocomplete=\"off\" placeholder=\"Например: г. Истра или Московская область\"><label for=\"selo\">Село, деревня, посёлок (если есть)</label><input id=\"selo\" autocomplete=\"off\" placeholder=\"Например: с. Павловская Слобода\"></div>\r\n    <div class=\"adrhead\"><label for=\"adr\">Улица</label><button class=\"linkbtn\" id=\"adrEdit\" type=\"button\"></button></div><div id=\"adrView\" class=\"adrview\" data-pusto=\"Улица определится автоматически\"></div><input id=\"adr\" hidden autocomplete=\"off\" value=\"${экран(о.улица)}\">\r\n    <div class=\"pair\"${!о.вручную && естьДом(о.улица) && !о.дом ? ' hidden' : ''}><div><label for=\"dom\">Дом</label><input id=\"dom\" autocomplete=\"off\" value=\"${экран(о.дом)}\"></div><div><label for=\"korp\">Корпус</label><input id=\"korp\" autocomplete=\"off\" value=\"${экран(о.корпус)}\"></div><div><label for=\"str\">Строение</label><input id=\"str\" autocomplete=\"off\" value=\"${экран(о.строение)}\"></div></div>\r\n    <label for=\"parkNo\">Номер парковки</label><input id=\"parkNo\" autocomplete=\"off\" maxlength=\"30\" value=\"${экран(о.номер)}\">\r\n    <label for=\"parkSum\">Сумма парковки, рублей</label><input id=\"parkSum\" inputmode=\"decimal\" autocomplete=\"off\" value=\"${литрыТекст(о.сумма)}\"></div>\r\n    <div class=\"foot\"><button class=\"main\" id=\"save\">Готово</button><button class=\"main danger\" id=\"del\">Удалить</button></div></div>`;\r\n  привязатьНастройки();\r\n  if (о.вручную) открытьПравку();\r\n  показАдреса();\r\n  document.getElementById('adrEdit').onclick = () => {\r\n    const п = document.getElementById('adr');\r\n    if (естьДом(п.value)) { п.hidden = false; показАдреса(); } else открытьПравку();\r\n    // Дом уже в улице (запись прошлой версии): поля дома скрываем, чтобы дом не попал в адрес дважды\r\n    if (естьДом(п.value)) document.getElementById('dom').closest('.pair').hidden = true;\r\n    п.focus();\r\n  };\r\n  // Номер сохраняем сразу: инженер мог выйти посмотреть его на табличке или в приложении оплаты\r\n  document.getElementById('parkNo').oninput = () => { о.номер = document.getElementById('parkNo').value.trim(); сохранить(); };\r\n  document.getElementById('parkSum').oninput = () => { const с = суммаИзПоля(); if (с !== null) { о.сумма = с; сохранить(); } };\r\n  document.getElementById('save').onclick = () => {\r\n    if (!document.getElementById('parkNo').value.trim()) { document.getElementById('parkNo').focus(); return alert('Впишите номер парковки.'); }\r\n    // Сумму могут ещё не знать: запись закрывается, в списке она останется красной\r\n    if (суммаИзПоля() === null) { document.getElementById('parkSum').focus(); return alert('Впишите сумму числом, например 150 или 150,50.'); }\r\n    if (о.вручную) {\r\n      const вр = document.getElementById('vrem').value;\r\n      if (!вр) { document.getElementById('vrem').focus(); return alert('Укажите время парковки.'); }\r\n      const ош = ошибкаРучногоАдреса(); if (ош) return alert(ош);\r\n      const [ч, мин] = вр.split(':').map(Number), нов = new Date(d.getFullYear(), d.getMonth(), d.getDate(), ч, мин);\r\n      if (нов.getTime() > Date.now()) return alert('Время парковки не может быть позже текущего.');\r\n      о.время = нов.getTime();\r\n    } else if (!улицаСейчас() && !о.поиск && о.широта == null) return alert('Телефон не определил место. Нажмите «Вписать адрес вручную» и впишите адрес парковки.');\r\n    {\r\n      const пара = document.getElementById('dom'), с = пара.closest('.pair').hidden;\r\n      const адр = составитьАдрес(улицаСейчас(), с ? '' : пара.value.trim(), с ? '' : document.getElementById('korp').value.trim(), с ? '' : document.getElementById('str').value.trim());\r\n      if (адр && !естьДом(адр) && !confirm('Вы не вписали дом. Такой адрес придётся уточнять в офисе. Всё равно закрыть?')) { if (!с) пара.focus(); return; }\r\n    }\r\n    записатьПолеПарковки(о); о.адресПроверен = !!о.адрес;\r\n    // В файле видно, откуда адрес: подставлен приложением или вписан инженером\r\n    const поездка = S.отметки.find((x) => x.id === о.изПоездки);\r\n    if (о.адрес && (о.изПоездки ? !поездка || поездка.адрес !== о.адрес : о.вручную || о.улица !== о.адресТелефона)) о.источникАдреса = 'вписан вручную';\r\n    // Новая запись в уже отправленном месяце: файл за этот месяц нужно отправить ещё раз\r\n    if (о.черновик) { delete о.черновик; delete S.отправленоМес[ключМесяца(new Date(о.время))]; }\r\n    сохранить(); открыта = null; показать();\r\n  };\r\n  document.getElementById('del').onclick = () => { if (о.черновик) { S.парковки = S.парковки.filter((x) => x !== о); открыта = null; показать(); return; } if (!confirm('Удалить эту запись о парковке?')) return; о.удалена = true; открыта = null; сохранить(); показать(); };\r\n}\r\nfunction строкаПарковки(о, сДатой) {\r\n  const d = new Date(о.время);\r\n  const адрес = о.адрес ? экран(о.адрес) : о.широта != null ? 'Место записано, адреса пока нет' : о.поиск ? 'Ищу координаты…' : '<span class=\"bad\">Впишите адрес</span>';\r\n  return `<button class=\"row parkrow\" data-id=\"${о.id}\"><time>${сДатой ? `${дв(d.getDate())}.${дв(d.getMonth() + 1)}<small>${дв(d.getHours())}:${дв(d.getMinutes())}</small>` : `${дв(d.getHours())}:${дв(d.getMinutes())}`}</time><span class=\"parkaddr\">${адрес}${о.номер ? `<small>Парковка № ${экран(о.номер)}</small>` : '<small class=\"bad\">Впишите номер парковки</small>'}${о.вручную ? '<small>Внесено вручную</small>' : ''}</span>${нетСуммы(о) ? '<span class=\"parksum bad\">Впишите сумму</span>' : `<span class=\"parksum\">${рубли(о.сумма)}</span>`}</button>`;\r\n}\r\n// Таблица парковок с итогом. Записи без суммы в итог не входят, это видно под ним\r\nfunction таблицаПарковок(записи, сДатой, подпись) {\r\n  const итог = записи.reduce((с, о) => с + (+о.сумма || 0), 0), безСуммы = записи.filter(нетСуммы).length;\r\n  return `<div class=\"card parktab\"><div class=\"parkhead\"><span>${сДатой ? 'Дата' : 'Время'}</span><span>Адрес</span><span>Сумма</span></div>${записи.map((о) => строкаПарковки(о, сДатой)).join('')}<div class=\"parktotal\"><span>${подпись}${безСуммы ? `<small style=\"display:block\">без суммы: ${безСуммы}</small>` : ''}</span><span>${рубли(итог)}</span></div></div>`;\r\n}\r\nfunction привязатьСтрокиПарковок() {\r\n  а.querySelectorAll('.row').forEach((r) => { r.onclick = () => { открыта = r.dataset.id; показать(); }; });\r\n}\r\nconst подвалФайла = () => { const можно = естьДанныеФайла(месяц); return `<div class=\"foot\"><button class=\"main light\" id=\"send\" ${можно ? '' : 'disabled'}>Отправить файл</button><button class=\"main light\" id=\"saveFile\" ${можно ? '' : 'disabled'}>Сохранить файл</button></div>`; };\r\nfunction привязатьФайл() {\r\n  document.getElementById('send').onclick = () => выгрузить(false);\r\n  document.getElementById('saveFile').onclick = () => выгрузить(true);\r\n}\r\n// Закладка «Парковки»: один день, как в закладке «Поездки»\r\nfunction экранПарковок() {\r\n  const сегодняКл = ключДня(new Date()), [дг, дм, дд] = деньСп.split('-');\r\n  const заДень = S.парковки.filter((о) => !о.удалена && !о.черновик && ключДня(new Date(о.время)) === деньСп).sort(поПорядку);\r\n  а.innerHTML = `<div class=\"screen\">${вкладки()}<button id=\"parkAdd\" type=\"button\">Внести парковку</button>\r\n    <div class=\"month\"><button id=\"prev\" aria-label=\"Прошлый день\">‹</button><div class=\"dayname\"><b>${деньСп === сегодняКл ? 'Сегодня, ' : ''}${дд}.${дм}.${дг}</b>${деньСп === сегодняКл ? '' : '<button class=\"linkbtn\" id=\"spToday\" type=\"button\">Вернуться к сегодня</button>'}<button class=\"linkbtn\" id=\"addPark\" type=\"button\">Добавить парковку вручную</button></div><button id=\"next\" aria-label=\"Следующий день\" ${деньСп === сегодняКл ? 'disabled' : ''}>›</button></div>\r\n    <div class=\"scroll\">${заДень.length ? таблицаПарковок(заДень, false, 'Итого за день') : '<div class=\"empty\">В этот день парковок нет.</div>'}</div>\r\n    ${подвалФайла()}</div>`;\r\n  привязатьВкладки(); привязатьФайл(); привязатьСтрокиПарковок();\r\n  document.getElementById('parkAdd').onclick = внестиПарковку;\r\n  document.getElementById('addPark').onclick = добавитьПарковкуВручную;\r\n  const сдвиг = (н) => { const t = new Date(+дг, +дм - 1, +дд + н); деньСп = ключДня(t); месяц = ключМесяца(t); показать(); };\r\n  document.getElementById('prev').onclick = () => сдвиг(-1);\r\n  document.getElementById('next').onclick = () => сдвиг(1);\r\n  const к = document.getElementById('spToday');\r\n  if (к) к.onclick = () => { const t = new Date(); деньСп = ключДня(t); месяц = ключМесяца(t); показать(); };\r\n}\r\n// Закладка «Месяц: парковки»: календарь и все парковки месяца\r\nfunction экранМесяцаПарковок() {\r\n  const [y, m] = месяц.split('-').map(Number), дней = new Date(y, m, 0).getDate(), пустых = (new Date(y, m - 1, 1).getDay() + 6) % 7, сегодняКл = ключДня(new Date());\r\n  const все = S.парковки.filter((о) => !о.удалена && !о.черновик && ключМесяца(new Date(о.время)) === месяц).sort(поПорядку), неполная = (о) => !о.номер || нетСуммы(о) || (!о.адрес && о.широта == null && !о.поиск), дополнить = все.filter(неполная).length, сумма = все.reduce((с, о) => с + (+о.сумма || 0), 0);\r\n  let ячейки = '<span></span>'.repeat(пустых), сПарковками = 0;\r\n  for (let д = 1; д <= дней; д++) {\r\n    const к = месяц + '-' + дв(д), заДень = все.filter((о) => ключДня(new Date(о.время)) === к), нед = (пустых + д - 1) % 7 >= 5;\r\n    if (заДень.length) сПарковками++;\r\n    ячейки += `<button class=\"cal${заДень.length ? ' est' : ''}${нед ? ' wk' : ''}${к === сегодняКл ? ' now' : ''}\" type=\"button\" data-k=\"${к}\"${к > сегодняКл ? ' disabled' : ''} aria-label=\"${дв(д)}.${дв(m)}${заДень.length ? ', есть парковки' : ', нет парковок'}\">${д}${заДень.some(неполная) ? '<i class=\"cald\"></i>' : ''}</button>`;\r\n  }\r\n  const прокрутка = (document.querySelector('.scroll') || {}).scrollTop || 0;\r\n  а.innerHTML = `<div class=\"screen\">${вкладки()}\r\n    <div class=\"month\"><button id=\"mPrev\" aria-label=\"Прошлый месяц\">‹</button><div class=\"monthtitle\"><b>${МЕСЯЦЫ[m - 1]} ${y}</b></div><button id=\"mNext\" aria-label=\"Следующий месяц\"${месяц >= ключМесяца(new Date()) ? ' disabled' : ''}>›</button></div>\r\n    <div class=\"scroll\"><div class=\"odo\"><div class=\"calgrid\">${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map((н) => `<small>${н}</small>`).join('')}${ячейки}</div>\r\n    <div class=\"callegend\"><span><i class=\"calbox est\"></i>Есть парковки</span><span><i class=\"cald\"></i>Нужно дополнить</span></div>\r\n    <div class=\"calsum\">Сумма за месяц: <b>${рубли(сумма)}</b> · парковок: <b>${все.length}</b> · дней: <b>${сПарковками}</b>${дополнить ? ` · дополнить: <b>${дополнить}</b>` : ''}</div></div>\r\n    ${все.length ? таблицаПарковок(все, true, 'Итого за месяц') : ''}</div>\r\n    ${подвалФайла()}</div>`;\r\n  привязатьВкладки(); привязатьФайл(); привязатьСтрокиПарковок();\r\n  document.querySelector('.scroll').scrollTop = прокрутка;\r\n  const сдвиг = (н) => { месяц = ключМесяца(new Date(y, m - 1 + н, 1)); показать(); };\r\n  document.getElementById('mPrev').onclick = () => сдвиг(-1);\r\n  document.getElementById('mNext').onclick = () => сдвиг(1);\r\n  а.querySelectorAll('.cal').forEach((b) => { b.onclick = () => { деньСп = b.dataset.k; вкладка = 'парковка'; месяц = деньСп.slice(0, 7); показать(); }; });\r\n}\r\n// Спидометр и заправки за день: сохраняются сразу при вводе. Предупреждения не мешают сохранить число\r\nfunction кнопкаФото(вид, подпись) {\r\n  const с = снимкиДня(ключДня(new Date())).filter((ф) => ф.вид === вид).pop();\r\n  return с ? `Фото ${подпись}: ${с.время}` : `Фото ${подпись}`;\r\n}\r\n// Итоги по заправкам: литры вписываются в отметках, здесь только сумма за день и за месяц\r\nfunction итогЗаправок(префикс) {\r\n  let карта = 0, личные = 0;\r\n  for (const к of Object.keys(S.заправки)) if (к.startsWith(префикс)) { карта += +S.заправки[к].карта || 0; личные += +S.заправки[к].личные || 0; }\r\n  const л = (x) => String(Math.round(x * 100) / 100).replace('.', ',');\r\n  return `картой ${л(карта)} л, за личные средства ${л(личные)} л`;\r\n}\r\nfunction строкаЗаправок() {\r\n  const [г, мс] = деньСп.split('-'), з = S.заправки[деньСп] || {};\r\n  return `<div class=\"fuel\"><div class=\"pair\"><div><label for=\"lK\">Заправился топливной картой, литров</label><input id=\"lK\" inputmode=\"decimal\" autocomplete=\"off\" value=\"${литрыТекст(з.карта)}\"></div>\r\n    <div><label for=\"lL\">Заправился за личные средства, литров</label><input id=\"lL\" inputmode=\"decimal\" autocomplete=\"off\" value=\"${литрыТекст(з.личные)}\"></div></div>\r\n    <div id=\"lMsg\" class=\"odomsg\"></div><div class=\"fuelsum\" id=\"fuelMonth\"><b>За ${МЕСЯЦЫ[+мс - 1].toLowerCase()}:</b> ${итогЗаправок(г + '-' + мс)}</div></div>`;\r\n}\r\nfunction блокСпидометра() {\r\n  const з = S.спидометр[деньСп] || {}, [г, мс, дн] = деньСп.split('-'), сегодня = деньСп === ключДня(new Date());\r\n  return `<label class=\"komchk${S.командировка[деньСп] ? ' on' : ''}\"><input type=\"checkbox\" id=\"kom\"${S.командировка[деньСп] ? ' checked' : ''}>В командировке</label><div class=\"odo\"><div class=\"adrhead\"><b>Спидометр, км</b>${снимкиДня(месяц).length ? '<button class=\"linkbtn\" id=\"phSend\" type=\"button\">Отправить фото архивом</button>' : ''}</div>\r\n    <div class=\"pair\"><div><label for=\"spV\">При выезде</label><input id=\"spV\" inputmode=\"numeric\" autocomplete=\"off\" value=\"${з.выезд == null ? '' : з.выезд}\"></div>\r\n    <div><label for=\"spB\">При возвращении</label><input id=\"spB\" inputmode=\"numeric\" autocomplete=\"off\" value=\"${з.возврат == null ? '' : з.возврат}\"></div></div>\r\n    ${сегодня ? `<div class=\"pair phrow\"><button class=\"phbtn\" id=\"phV\" type=\"button\">${кнопкаФото('выезд', 'при выезде')}</button><button class=\"phbtn\" id=\"phB\" type=\"button\">${кнопкаФото('возврат', 'при возвращении')}</button></div>` : ''}\r\n    <div id=\"spMsg\" class=\"odomsg\"></div>${строкаЗаправок()}</div>`;\r\n}\r\nfunction числоСпидометра(id) {\r\n  const т = document.getElementById(id).value.replace(/\\s/g, '');\r\n  return /^\\d{1,7}$/.test(т) ? Number(т) : null;\r\n}\r\nfunction сообщениеСпидометра() {\r\n  const в = числоСпидометра('spV'), б = числоСпидометра('spB'), с = document.getElementById('spMsg');\r\n  const прошлые = Object.keys(S.спидометр).filter((к) => к < деньСп && S.спидометр[к].возврат != null).sort();\r\n  const прошл = прошлые.length ? S.спидометр[прошлые[прошлые.length - 1]].возврат : null;\r\n  let т = '', ош = false;\r\n  if ((document.getElementById('spV').value.trim() && в == null) || (document.getElementById('spB').value.trim() && б == null)) { т = 'Впишите показания целым числом, только цифры.'; ош = true; }\r\n  else if (в != null && прошл != null && в < прошл) { т = `При выезде меньше, чем при прошлом возвращении (${прошл} км). Проверьте число.`; ош = true; }\r\n  else if (в != null && б != null && б < в) { т = 'При возвращении меньше, чем при выезде. Проверьте число.'; ош = true; }\r\n  else if (в != null && б != null) т = `Пробег за день: ${б - в} км.`;\r\n  с.textContent = т; с.classList.toggle('bad', ош);\r\n}\r\nfunction привязатьСпидометр() {\r\n  const сохр = () => {\r\n    const в = числоСпидометра('spV'), б = числоСпидометра('spB');\r\n    if (в == null && б == null) delete S.спидометр[деньСп]; else S.спидометр[деньСп] = { выезд: в, возврат: б };\r\n    сохранить(); сообщениеСпидометра();\r\n  };\r\n  const сохрЛитры = () => {\r\n    const лк = литрыИзПоля('lK'), лл = литрыИзПоля('lL'), м = document.getElementById('lMsg');\r\n    м.textContent = лк === null || лл === null ? 'Проверьте литры: впишите число от 0 до 200, например 35,5.' : '';\r\n    м.classList.toggle('bad', лк === null || лл === null);\r\n    if (лк === null || лл === null) return;\r\n    if (лк === '' && лл === '') delete S.заправки[деньСп]; else S.заправки[деньСп] = { карта: лк, личные: лл };\r\n    сохранить();\r\n    const [г, мс] = деньСп.split('-');\r\n    document.getElementById('fuelMonth').innerHTML = `<b>За ${МЕСЯЦЫ[+мс - 1].toLowerCase()}:</b> ${итогЗаправок(г + '-' + мс)}`;\r\n  };\r\n  document.getElementById('kom').onchange = (e) => { if (e.target.checked) S.командировка[деньСп] = true; else delete S.командировка[деньСп]; сохранить(); показать(); };\r\n  document.getElementById('lK').oninput = сохрЛитры;\r\n  document.getElementById('lL').oninput = сохрЛитры;\r\n  document.getElementById('spV').oninput = сохр;\r\n  document.getElementById('spB').oninput = сохр;\r\n  const снять = (вид) => {\r\n    if (ТЕЛЕФОН && ТЕЛЕФОН.takePhoto) ТЕЛЕФОН.takePhoto(вид, S.инженер);\r\n    else alert('Фото можно снять только в приложении на телефоне.');\r\n  };\r\n  const кнВ = document.getElementById('phV'), кнБ = document.getElementById('phB'), кнА = document.getElementById('phSend');\r\n  if (кнВ) кнВ.onclick = () => снять('выезд');\r\n  if (кнБ) кнБ.onclick = () => снять('возврат');\r\n  if (кнА) кнА.onclick = () => { кнА.textContent = 'Собираю архив…'; кнА.disabled = true; ТЕЛЕФОН.makeArchive(месяц, S.инженер); };\r\n  const к = document.getElementById('spToday');\r\n  if (к) к.onclick = () => { const t = new Date(); деньСп = ключДня(t); месяц = ключМесяца(t); показать(); };\r\n  сообщениеСпидометра();\r\n}\r\n// Самый ранний прошлый месяц с данными, за который файл не отправляли\r\nfunction забытыйМесяц() {\r\n  const сейчас = ключМесяца(new Date());\r\n  if (месяц !== сейчас) return null;\r\n  const есть = [...S.отметки.filter((о) => !о.удалена).map((о) => ключМесяца(new Date(о.время))), ...Object.keys(S.спидометр).map((к) => к.slice(0, 7)), ...Object.keys(S.заправки).map((к) => к.slice(0, 7)), ...Object.keys(S.командировка).map((к) => к.slice(0, 7)), ...S.парковки.filter((о) => !о.удалена).map((о) => ключМесяца(new Date(о.время)))];\r\n  return [...new Set(есть)].filter((м) => м < сейчас && !S.отправленоМес[м]).sort()[0] || null;\r\n}\r\n// Записи дня идут по времени приезда\r\nconst поПорядку = (x, y) => x.время - y.время;\r\n// Первый за день «Выезд из дома» всегда первый, последний «Вернулся домой» всегда последний. Несколько таких записей в дне бывает только в данных версий до 1.66: они остаются по времени\r\nfunction порядокДня(записи) {\r\n  const р = записи.slice().sort(поПорядку);\r\n  const выезд = р.find((о) => о.событие === 'выезд' && !о.удалена), возврат = р.filter((о) => о.событие === 'возврат' && !о.удалена).pop();\r\n  return [...(выезд ? [выезд] : []), ...р.filter((о) => о !== выезд && о !== возврат), ...(возврат ? [возврат] : [])];\r\n}\r\n// Что осталось заполнить в этот день. Сегодняшнее возвращение ещё впереди, его не спрашиваем\r\nfunction проблемыДня(к, записи) {\r\n  const с = S.спидометр[к] || {}, п = [], есть = (x) => x !== null && x !== undefined && x !== '';\r\n  if (!записи.length) { if (есть(с.выезд) || есть(с.возврат)) п.push('спидометр вписан, а поездок нет'); return п; }\r\n  if (!есть(с.выезд)) п.push('нет спидометра при выезде');\r\n  if (!есть(с.возврат) && к !== ключДня(new Date())) п.push('нет спидометра при возвращении');\r\n  if (записи.some((о) => !о.адрес)) п.push('есть запись без адреса');\r\n  else if (записи.some((о) => !естьДом(о.адрес))) п.push('в адресе нет дома');\r\n  return п;\r\n}\r\n// Напоминания и резервная копия: настройки в закладке «Месяц: поездки». Напоминания показывает телефон, даже когда приложение закрыто\r\nconst НАПОМИНАНИЯ = { вкл: true, утро: '08:00', вечер: '19:00', выходные: false };\r\n// Первый запуск: инженер сам выбирает время напоминаний или отказывается. Пока не ответил, главный экран не показываем\r\nfunction спроситьНапоминания() {\r\n  if (!ТЕЛЕФОН || !ТЕЛЕФОН.setReminders || S.напоминания) return false;\r\n  а.innerHTML = `<div class=\"card nap\" style=\"max-height:100%;overflow-y:auto\"><b>Напоминания про спидометр</b>\r\n    <p class=\"tip\">Телефон напомнит вписать показания спидометра и нажать кнопку дома, только если вы этого ещё не сделали. Укажите удобное время или откажитесь от напоминаний.</p>\r\n    <div class=\"pair\"><div><label for=\"napU\">При выезде — в</label><input id=\"napU\" type=\"time\" value=\"${НАПОМИНАНИЯ.утро}\"></div><div><label for=\"napV\">При возвращении — в</label><input id=\"napV\" type=\"time\" value=\"${НАПОМИНАНИЯ.вечер}\"></div></div>\r\n    <label class=\"chk\"><input type=\"checkbox\" id=\"napW\">И в субботу, и в воскресенье</label>\r\n    <button class=\"main\" id=\"napYes\" type=\"button\">Включить напоминания</button>\r\n    <button class=\"main light\" id=\"napNo\" type=\"button\">Не напоминать</button>\r\n    <p class=\"tip\">Изменить время, включить или выключить напоминания можно позже внизу закладки «Месяц: поездки».</p></div>`;\r\n  const записать = (вкл) => {\r\n    const утро = document.getElementById('napU').value, вечер = document.getElementById('napV').value;\r\n    if (вкл && (!утро || !вечер)) return alert('Укажите время напоминаний при выезде и при возвращении.');\r\n    if (вкл && вечер <= утро) return alert('Время при возвращении должно быть позже времени при выезде.');\r\n    S.напоминания = { вкл, утро: утро || НАПОМИНАНИЯ.утро, вечер: вечер || НАПОМИНАНИЯ.вечер, выходные: document.getElementById('napW').checked };\r\n    сохранить(); ТЕЛЕФОН.setReminders();\r\n    if (вкл && ТЕЛЕФОН.askNotifications) ТЕЛЕФОН.askNotifications();\r\n    показать();\r\n  };\r\n  document.getElementById('napYes').onclick = () => записать(true);\r\n  document.getElementById('napNo').onclick = () => записать(false);\r\n  return true;\r\n}\r\nwindow.__notif = () => { if (!открыта && !смена) показать(); };\r\nwindow.__restored = (р) => {\r\n  if (р.ошибка) return alert('Не удалось восстановить записи: ' + р.ошибка + '.');\r\n  alert(`Записи восстановлены из резервной копии от ${р.создано}.`);\r\n  location.reload();\r\n};\r\nfunction блокНапоминаний() {\r\n  if (!ТЕЛЕФОН || !ТЕЛЕФОН.setReminders) return '';\r\n  const н = { ...НАПОМИНАНИЯ, вкл: false, ...(S.напоминания || {}) };\r\n  const можно = !ТЕЛЕФОН.notificationsAllowed || ТЕЛЕФОН.notificationsAllowed();\r\n  const копия = ТЕЛЕФОН.backupInfo ? ТЕЛЕФОН.backupInfo() : '';\r\n  return `<div class=\"card nap\"><b>Напоминания</b>\r\n    <label class=\"chk\"><input type=\"checkbox\" id=\"napOn\"${н.вкл ? ' checked' : ''}>Напоминать про спидометр и кнопки дома</label>\r\n    <div class=\"pair\"${н.вкл ? '' : ' hidden'}><div><label for=\"napU\">При выезде — в</label><input id=\"napU\" type=\"time\" value=\"${экран(н.утро)}\"></div><div><label for=\"napV\">При возвращении — в</label><input id=\"napV\" type=\"time\" value=\"${экран(н.вечер)}\"></div></div>\r\n    <label class=\"chk\"${н.вкл ? '' : ' hidden'}><input type=\"checkbox\" id=\"napW\"${н.выходные ? ' checked' : ''}>И в субботу, и в воскресенье</label>\r\n    ${н.вкл && !можно ? '<div class=\"notice\">Уведомления выключены в настройках телефона.<button id=\"napSet\" type=\"button\">Открыть настройки уведомлений</button></div>' : ''}\r\n    <p class=\"tip\">Напоминание приходит, только если что-то не сделано. В первые дни месяца приложение напомнит отправить журнал за прошлый месяц.</p></div>\r\n    <div class=\"card nap\"><b>Резервная копия</b><p class=\"tip\">${копия ? `Последняя копия: ${экран(копия)}.` : 'Копии пока нет.'} Каждый вечер в 21:00 телефон сохраняет копию в папку «Загрузки», затем «Журнал поездок». Новая копия заменяет прежнюю, поэтому копия всегда одна. Если приложение переустановят, записи можно вернуть из неё. Если телефон потеряется, копия пропадёт вместе с ним.</p></div>`;\r\n}\r\nfunction привязатьНапоминания() {\r\n  const вкл = document.getElementById('napOn');\r\n  if (!вкл) return;\r\n  const записать = () => {\r\n    const было = S.напоминания && S.напоминания.вкл;\r\n    const у = document.getElementById('napU').value || НАПОМИНАНИЯ.утро, в = document.getElementById('napV').value || НАПОМИНАНИЯ.вечер;\r\n    if (вкл.checked && в <= у) { alert('Время при возвращении должно быть позже времени при выезде.'); показать(); return; }\r\n    S.напоминания = { вкл: вкл.checked, утро: у, вечер: в, выходные: document.getElementById('napW').checked };\r\n    сохранить(); ТЕЛЕФОН.setReminders();\r\n    if (вкл.checked && !было && ТЕЛЕФОН.askNotifications) ТЕЛЕФОН.askNotifications();\r\n    показать();\r\n  };\r\n  ['napOn', 'napU', 'napV', 'napW'].forEach((id) => { document.getElementById(id).onchange = записать; });\r\n  const н = document.getElementById('napSet');\r\n  if (н) н.onclick = () => ТЕЛЕФОН.openNotifSettings();\r\n}\r\n// Закладка «Данные за месяц»: видно, в какие дни есть поездки, а какие дни инженер пропустил\r\nfunction экранМесяца() {\r\n  const [y, m] = месяц.split('-').map(Number), дней = new Date(y, m, 0).getDate(), пустых = (new Date(y, m - 1, 1).getDay() + 6) % 7, сегодняКл = ключДня(new Date()), вМесяце = ключМесяца(new Date());\r\n  const все = S.отметки.filter((о) => !о.удалена && !о.черновик && ключМесяца(new Date(о.вр   }
  async function сохранитьКопию() {
    var сФото = $('kopFoto') && $('kopFoto').checked, х = хранилище(), фото = [];
    if (сФото) for (var ф of await всеФото()) фото.push([ф[0], в64(new Uint8Array(await ф[1].arrayBuffer()))]);
    var когда = сейчасТекстом(), т = JSON.stringify(х);
    var копия = { тип: ТИП, версия: 1, создано: когда, хранилище: х, фото: фото, код: К.код('единая|' + т) };
    var d = new Date();
    скачать('Журнал и топливный отчёт — копия ' + d.getFullYear() + '-' + дв(d.getMonth() + 1) + '-' + дв(d.getDate()) + '.json', JSON.stringify(копия), 'application/json');
    хран.set(КОГДА, когда); хран.set(ОТПЕЧАТОК, К.sha256hex(т));
    показатьКопию(); отметкаКопии();
  }
  // Копия в формате приложения на телефоне: её можно восстановить в Android-приложении «Журнал поездок»
  function копияДляТелефона() {
    var д = хран.get('otmetki-v1');
    if (!д) return alert('В журнале поездок пока нет записей.');
    var когда = сейчасТекстом();
    скачать('Журнал поездок — резервная копия.json', JSON.stringify({ тип: ТИП_APK, версия: 1, создано: когда, данные: д, код: К.код('копия|' + д) }), 'application/json');
  }
  async function восстановитьИз(текст) {
    var о; try { о = JSON.parse(текст); } catch (e) { throw new Error('это не резервная копия'); }
    if (о.тип === ТИП_APK) {
      if (К.код('копия|' + о.данные) !== о.код) throw new Error('копия изменена после сохранения, восстановить её нельзя');
      if (!confirm('Это копия приложения на телефоне от ' + о.создано + '. Записи журнала поездок на этом планшете заменятся записями из копии. Топливный отчёт не изменится. Продолжить?')) return false;
      хран.set('otmetki-v1', о.данные);
      return true;
    }
    if (о.тип !== ТИП) throw new Error('это не резервная копия журнала и топливного отчёта');
    if (К.код('единая|' + JSON.stringify(о.хранилище)) !== о.код) throw new Error('копия изменена после сохранения, восстановить её нельзя');
    if (!confirm('Копия от ' + о.создано + '. Всё, что сейчас записано на этом планшете (журнал и топливные отчёты), заменится данными из копии. Продолжить?')) return false;
    var список = []; try { список = JSON.parse(о.хранилище['otmetki-photos'] || '[]'); } catch (e) { /* без снимков */ }
    var фото = (о.фото || []).map(function (ф) { return [ф[0], из64(ф[1])]; }).filter(function (ф) {
      var м = список.find(function (x) { return x.файл === ф[0]; });
      return м && м.sha === К.sha256hex(ф[1]);
    }).map(function (ф) { return [ф[0], new Blob([ф[1]], { type: 'image/jpeg' })]; });
    Object.keys(хранилище()).forEach(function (к) { localStorage.removeItem(к); });
    Object.keys(о.хранилище).forEach(function (к) { localStorage.setItem(к, о.хранилище[к]); });
    await записатьФото(фото);
    хран.set(КОГДА, о.создано); хран.set(ОТПЕЧАТОК, К.sha256hex(JSON.stringify(о.хранилище)));
    return true;
  }
  $('fileKop').onchange = function (e) {
    var f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    f.text().then(восстановитьИз).then(function (да) {
      if (!да) return;
      alert('Данные восстановлены из копии. Страница откроется заново.');
      location.reload();
    }, function (err) { alert('Не удалось восстановить: ' + (err && err.message || err) + '.'); });
  };
  function нужнаКопия() {
    if (!естьДанные()) return false;
    var когда = хран.get(КОГДА);
    if (!когда) return true;
    return хран.get(ОТПЕЧАТОК) !== К.sha256hex(JSON.stringify(хранилище()));
  }
  function отметкаКопии() {
    var к = $('tK'), есть = к.querySelector('.dot'), надо = нужнаКопия();
    if (надо && !есть) к.insertAdjacentHTML('beforeend', '<i class="dot"></i>');
    if (!надо && есть) есть.remove();
  }
  setInterval(отметкаКопии, 60000);
  function показатьКопию() {
    var когда = хран.get(КОГДА), надо = нужнаКопия(), фото = []; try { фото = JSON.parse(хран.get('otmetki-photos') || '[]'); } catch (e) { /* нет */ }
    vK.innerHTML = '<div class="card"><h2>Резервная копия</h2>' +
      (когда ? '<div class="notice' + (надо ? '' : ' ok') + '">Последняя копия: ' + экран(когда) + (надо ? '. После неё были изменения — сохраните новую.' : '. После неё изменений не было.') + '</div>' : (естьДанные() ? '<div class="notice">Копии ещё нет. Сохраните её, чтобы не потерять записи.</div>' : '')) +
      '<p class="tip">Все записи (' + (ТОЛЬКО_ЖУРНАЛ ? 'журнал поездок и фото спидометра' : 'журнал поездок, карточка сотрудника, топливные отчёты всех месяцев') + ') хранятся только в этом браузере на этом планшете. Они пропадут, если очистить данные браузера или открыть файл в другом браузере. Сохраняйте копию хотя бы раз в неделю и после отправки отчёта; храните её на диске компании или отправьте себе почтой.</p>' +
      (фото.length ? '<label class="chk"><input type="checkbox" id="kopFoto" checked>Вместе с фото спидометра (' + фото.length + ' шт.)</label>' : '') +
      '<button class="btn" id="kopSave" type="button">💾 Сохранить резервную копию</button>' +
      '<button class="btn light" id="kopLoad" type="button">Восстановить из копии</button>' +
      '<p class="tip">Подходит и копия из приложения «Журнал поездок» на телефоне (папка «Загрузки» → «Журнал поездок»): так записи с телефона переносятся на планшет.</p></div>' +
      '<div class="card"><h2>Перенести журнал на телефон</h2><p class="tip">Файл, который примет приложение «Журнал поездок» на Android-телефоне: на телефоне нажмите «Восстановить из резервной копии» и выберите его. Переносятся только записи журнала.</p>' +
      '<button class="btn light" id="kopApk" type="button">Сохранить копию для приложения на телефоне</button></div>';
    $('kopSave').onclick = function () { сохранитьКопию().catch(function (e) { alert('Не удалось сохранить копию: ' + (e && e.message || e)); }); };
    $('kopLoad').onclick = function () { $('fileKop').click(); };
    $('kopApk').onclick = копияДляТелефона;
  }
  // Кнопка «Восстановить из резервной копии» на первом экране журнала
  window.__ЕДИНЫЙ = { восстановить: function () { $('fileKop').click(); }, восстановитьИз: восстановитьИз, хранилище: хранилище };

  // ---------- запуск ----------
  fJ.srcdoc = window.__ЖУРНАЛ_HTML__;
  if (!ТОЛЬКО_ЖУРНАЛ) fR.srcdoc = window.__ОТЧЁТ_HTML__;
  var была = хран.get(ЗАКЛАДКА);
  открыть(['tJ', 'tR', 'tK'].indexOf(была) >= 0 ? была : 'tJ');
  fJ.addEventListener('load', function () { $('load').remove(); }, { once: true });
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});</script>
